<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Trouvez ou proposez une colocation étudiante simplement.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#D5F2EA">
  <meta name="apple-mobile-web-app-title" content="Colloc">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Colloc – Colocations étudiantes</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:linear-gradient(160deg,#F0FBF8,#D5F2EA);color:#0F1F1D;font-family:system-ui,sans-serif;z-index:10;transition:opacity .4s}
    #splash img{width:96px;height:96px;border-radius:24px;box-shadow:0 12px 40px rgba(15,118,110,.30);animation:pop 1.4s ease-in-out infinite}
    #splash b{font-size:28px;letter-spacing:.5px}
    #splash i{font-style:normal;opacity:.8;font-size:14px}
    @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  </style>
  <div id="splash"><img src="icons/Icon-192.png" alt=""><b>Colloc</b><i>Trouve ta coloc</i></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = 0; setTimeout(function () { s.remove(); }, 450); }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
