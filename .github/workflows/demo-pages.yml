# Page de test (mode démo : données fictives, aucun serveur) hébergée gratuitement sur GitHub Pages.
# À activer une fois : Settings → Pages → Source = "GitHub Actions".
name: Demo page
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Build (mode démo = sans SUPABASE_*)
        run: |
          VERSION="$(date -u +%Y%m%d.%H%M)-${GITHUB_SHA::7}"
          flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/" --dart-define=APP_VERSION="$VERSION"
          echo "{\"colloc_version\":\"$VERSION\"}" > build/web/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
